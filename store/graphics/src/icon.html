<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!-- Full-bleed store / launcher icon. Never masked, so the rosette can run larger than the adaptive foreground. -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#2B4E8E"/>
      <stop offset="58%" stop-color="#23417A"/>
      <stop offset="100%" stop-color="#152A52"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4C87A"/>
      <stop offset="48%" stop-color="#C8A64A"/>
      <stop offset="100%" stop-color="#9C7C2C"/>
    </linearGradient>
    <path id="petal" d="M256 76 C 304 128, 304 204, 256 256 C 208 204, 208 128, 256 76 Z"/>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g fill="none" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round">
    <use href="#petal"/>
    <use href="#petal" transform="rotate(45 256 256)"/>
    <use href="#petal" transform="rotate(90 256 256)"/>
    <use href="#petal" transform="rotate(135 256 256)"/>
    <use href="#petal" transform="rotate(180 256 256)"/>
    <use href="#petal" transform="rotate(225 256 256)"/>
    <use href="#petal" transform="rotate(270 256 256)"/>
    <use href="#petal" transform="rotate(315 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="34" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <circle cx="256" cy="256" r="9" fill="url(#gold)"/>
</svg>
</body>
</html>
