<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#2B4E8E"/>
      <stop offset="58%" stop-color="#23417A"/>
      <stop offset="100%" stop-color="#152A52"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4C87A"/>
      <stop offset="48%" stop-color="#C8A64A"/>
      <stop offset="100%" stop-color="#9C7C2C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Rub el Hizb: two overlapping squares, one axis-aligned, one at 45deg -->
  <g fill="none" stroke="url(#gold)" stroke-width="17" stroke-linejoin="round">
    <rect x="106" y="106" width="300" height="300" rx="10"/>
    <rect x="106" y="106" width="300" height="300" rx="10" transform="rotate(45 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="34" fill="none" stroke="url(#gold)" stroke-width="17"/>
  <circle cx="256" cy="256" r="9" fill="url(#gold)"/>
</svg>
</body>
</html>
