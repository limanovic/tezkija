<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!--
  Adaptive-icon foreground layer. Android crops to the central 66/108 of the
  canvas, so all artwork stays inside a circle of radius ~156 around (256,256):
  the rotated square's vertices sit at 110 * sqrt(2) = 156.
-->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4C87A"/>
      <stop offset="48%" stop-color="#C8A64A"/>
      <stop offset="100%" stop-color="#9C7C2C"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-width="13" stroke-linejoin="round">
    <rect x="146" y="146" width="220" height="220" rx="8"/>
    <rect x="146" y="146" width="220" height="220" rx="8" transform="rotate(45 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="25" fill="none" stroke="url(#gold)" stroke-width="13"/>
  <circle cx="256" cy="256" r="7" fill="url(#gold)"/>
</svg>
</body>
</html>
