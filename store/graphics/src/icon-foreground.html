<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!--
  Adaptive-icon foreground layer. Android crops to the central 66/108 of the
  canvas, so all artwork stays inside a circle of radius ~156 around (256,256):
  petal tips sit at 150 from centre, plus half the stroke.
-->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4C87A"/>
      <stop offset="48%" stop-color="#C8A64A"/>
      <stop offset="100%" stop-color="#9C7C2C"/>
    </linearGradient>
    <path id="petal" d="M256 112 C 294 154, 294 214, 256 256 C 218 214, 218 154, 256 112 Z"/>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-width="12" stroke-linejoin="round">
    <use href="#petal"/>
    <use href="#petal" transform="rotate(45 256 256)"/>
    <use href="#petal" transform="rotate(90 256 256)"/>
    <use href="#petal" transform="rotate(135 256 256)"/>
    <use href="#petal" transform="rotate(180 256 256)"/>
    <use href="#petal" transform="rotate(225 256 256)"/>
    <use href="#petal" transform="rotate(270 256 256)"/>
    <use href="#petal" transform="rotate(315 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="25" fill="none" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="256" cy="256" r="7" fill="url(#gold)"/>
</svg>
</body>
</html>
