<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!-- Themed-icon layer: flat silhouette, the system supplies the tint. Same safe zone as the foreground. -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linejoin="round">
    <rect x="146" y="146" width="220" height="220" rx="8"/>
    <rect x="146" y="146" width="220" height="220" rx="8" transform="rotate(45 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="25" fill="none" stroke="#FFFFFF" stroke-width="15"/>
  <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>
</svg>
</body>
